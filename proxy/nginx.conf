worker_processes 4;
user root;
error_log /root/cyber-girlfriend/logs/nginx-error.log warn;
pid /root/cyber-girlfriend/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 80m;
    # Streaming endpoints stay open or reconnect frequently; access records are
    # noise here. Keep warnings/errors only.
    access_log off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 19800 ssl;
        server_name _;

        ssl_certificate     /root/cyber-girlfriend/proxy/certs/server.crt;
        ssl_certificate_key /root/cyber-girlfriend/proxy/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location /avatar/ {
            alias /root/cyber-girlfriend/assets/;
            add_header Cache-Control "public, max-age=86400";
        }

        location /av/ {
            proxy_pass http://127.0.0.1:18011/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
            client_max_body_size 80m;
        }

        # Renderer mutation/audio ingestion is internal-only. Public viewers
        # may watch the FLV stream and list looks, but cannot change the shared
        # avatar or inject/interrupt its audio with a handcrafted request.
        location ~ ^/av/(avatar|motion-config|audio|audio-chunk|audio-finish|interrupt)$ {
            return 403;
        }

        location /lt/ {
            proxy_pass http://127.0.0.1:18010/;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            client_max_body_size 80m;
        }

        location /v1/realtime {
            # Realtime audio is issued through /api/session and proxied by the
            # room server. Direct access would bypass the call-in queue.
            return 403;
        }

        location / {
            proxy_pass http://127.0.0.1:17860;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
